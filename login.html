<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iBay - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="site-header">
        <div class="top-header">
            <div class="logo">
                <a href="index.html">iBay</a>
            </div>

            <nav class="top-nav">
                <a href="sell.html">Sell</a>
                <a href="signup.html">Signup</a>
                <a href="login.html">Login</a>
            </nav>

            <div class="header-actions">
                <div class="search-bar">
                    <input type="text" placeholder="Search for items...">
                </div>
                <a href="login.html" class="icon-button">👤</a>
                <a href="basket.html" class="icon-button">🛒</a>
            </div>
        </div>
    </header>

    <main class="auth-page">
        <section class="auth-card">
            <h1>Login to iBay</h1>
            <p class="auth-subtitle">Access your account to manage listings, saved items, and purchases.</p>

            <form class="auth-form" action="php/login.php" method="post">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <div class="login-row">
                    <label class="remember-me">
                        <input type="checkbox" name="remember">
                        <span>Remember me</span>
                    </label>

                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" class="primary-button">Login</button>

                <p class="auth-switch">
                    New to iBay?
                    <a href="signup.html">Create an account</a>
                </p>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 iBay Marketplace. All rights reserved.</p>
    </footer>

</body>
</html>
