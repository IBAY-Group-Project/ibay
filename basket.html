<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iBay - Online Marketplace</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/main.js" defer></script>
    
</head>


<body> 

    <header class="header"> 

        <div id = 'menu'>
            <img src='images/menu.svg' width='30' alt='Menu Icon' />
        </div>

        <a class ="button" href="sell.html"> Sell </a>



        <div id="logo">
            <a href="index.html"> 
            <img src="images/ibay.svg" width="200" alt=" Ebay Logo" />
            </a>
        </div>

        <div id="login">
            <a href="signup.html" class="signup-button">Signup</a>
            <a href="login.html" class="login-button">Login</a>
        </div> 
  
    </header>

    <main>
        <div class="basket-header"> 
            <h1>Basket</h1>
            <h3>[1 of 1 items selected]</h3>
        </div>

        <section class="basket-items">

            <div class="basket-item"> 

                <div class="basket-tickbox">
                    <input type="checkbox" id="item1" name="item1" checked>
                </div>

                <div class="basket-item-image">
                    <img src="images/products/product1.webp" alt="Product Image">
                </div>

                <div class="basket-item-details">
                    <h3 class="basket-item-title">Product 1</h3>   
                    <h1 id="basket-item-price">£24.99</h1>
                    <p id="basket-item-description">Lorem ipsum dolor sit amet</p>
                </div>

                <div class="basket-quantity">
                    <label for="quantity">Qty:</label>
                    <input type="number" id="quantity" name="quantity" value="1" min="1" max="10">
                </div>
                
                <div class="basket-remove">
                    <a href="#" class="remove-button">Remove</a>
                </div>

            </div>

        </section>

        <section class="basket-summary">

            <h2>Order Summary</h2>
            <div class="basket-details">
                <p>Subtotal: £24.99</p>
                <p>Shipping: £5.00</p>
                <p>Total: £29.99</p>
            </div>



        </section>

        <section class="basket-buttons">
            
            <a href="index.html" class="button" id="continue-button">Continue Shopping</a>
            <a href="checkout.html" class="button" id="checkout-button">Proceed to Checkout</a>

        </section>

    <footer>

        <div id="footer", class="footer" >
             &copy; 2026 iBay Marketplace. All rights reserved.
        </div>
    </footer>
    
</body> 

</html>
