<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iBay - Online Marketplace</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/main.js" defer></script>
    
</head>


<body> 

    <header class="header"> 

        <div id = 'menu'>
            <img src='images/menu.svg' width='30' alt='Menu Icon' />        
        </div>

        <div id="sell-button"> 
            <a class ="sell-button button" href="sell.html"> Sell </a>
        </div>



        <div id="logo">
            <a href="index.html">                                                   
            <img src="images/ibay.svg" width="200" alt=" Ebay Logo" />              <!-- its the ebay logo but we'll change it to ibay later, just a placeholder for now -->
    
            </a>
        </div>

        <div id = 'account'>
            <img src='images/profile.svg' class="account-icon" alt='Account Icon' />
        </div>
  
    </header>

     <main>
        <search id="search" class="search" aria-label="Site-wide Search"> 
            <input type="text" placeholder="Search for products, brands and more" class="search-bar">
            <a class ="button" id="search-button" href="search.html"> Search </a>

        </search> 

        <section id="carousel">

            
            <div class="carousel-content">
                <span class="carousel-arrow left">&lt;</span>
                <span class="carousel-arrow right">&gt;</span>
                Featured Items Here (PLACEHOLDER)
            </div>
            
            <div class="carousel-dots">
                <span class="dot active"></span>                     <!-- Active dot for the first slide -->
                <span class="dot"></span>                            <!-- Dot for the second slide -->
                <span class="dot"></span>                            <!-- Dot for the third slide -->
            </div>
        </section>


        <section class="categories">  
            <div class="category" id="Machines">Machines </div> 
            <div class="category" id="Clothing">Clothing </div>
            <div class="category" id="Devices">Devices </div>
            <div class="category" id="Gardening">Gardening </div>
        </section>

    </main>


    <footer>

        <div id="footer", class="footer" >
             &copy; 2026 iBay Marketplace. All rights reserved.
        </div>
    </footer>
    
</body> 

</html>
